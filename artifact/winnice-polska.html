<title>Winnice w Polsce — ужин и ночлег на винограднике</title>
<style>
:root{
  --ground:#E4E8E1;
  --surface:#F8F9F5;
  --surface-2:#EDF0E9;
  --ink:#151E19;
  --ink-soft:#3A4A41;
  --muted:#66766C;
  --line:#C6CFC4;
  --line-soft:#D6DDD3;
  --accent:#6B3B63;
  --accent-ink:#FFFFFF;
  --accent-soft:#EFE2ED;
  --gold:#A8781F;
  --gold-soft:#F2E7CE;
  --land:#DDE3D8;
  --land-line:#96A594;
  --water:#AFC4C9;
  --water-line:#6F97A2;
  --road:#C0A374;
  --shadow:0 1px 2px rgba(21,30,25,.06),0 8px 28px rgba(21,30,25,.10);
  --shadow-lift:0 2px 6px rgba(21,30,25,.10),0 18px 48px rgba(21,30,25,.18);
  --f-display:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua","Hoefler Text",Georgia,serif;
  --f-body:"Avenir Next","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --f-data:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#0F1512;
    --surface:#171F1A;
    --surface-2:#1E2822;
    --ink:#E4EADF;
    --ink-soft:#BDC8BE;
    --muted:#8B9A8E;
    --line:#2C3830;
    --line-soft:#243029;
    --accent:#C98CBF;
    --accent-ink:#1A1017;
    --accent-soft:#2E1F2C;
    --gold:#DFB45E;
    --gold-soft:#31281440;
    --land:#1D2721;
    --land-line:#44584A;
    --water:#16262B;
    --water-line:#3E626C;
    --road:#6B5836;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 28px rgba(0,0,0,.45);
    --shadow-lift:0 2px 6px rgba(0,0,0,.5),0 18px 48px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --ground:#0F1512;
  --surface:#171F1A;
  --surface-2:#1E2822;
  --ink:#E4EADF;
  --ink-soft:#BDC8BE;
  --muted:#8B9A8E;
  --line:#2C3830;
  --line-soft:#243029;
  --accent:#C98CBF;
  --accent-ink:#1A1017;
  --accent-soft:#2E1F2C;
  --gold:#DFB45E;
  --gold-soft:#31281440;
  --land:#1D2721;
  --land-line:#44584A;
  --water:#16262B;
  --water-line:#3E626C;
  --road:#6B5836;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 28px rgba(0,0,0,.45);
  --shadow-lift:0 2px 6px rgba(0,0,0,.5),0 18px 48px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
html{height:100%}
body{
  margin:0;background:var(--ground);color:var(--ink);
  font-family:var(--f-body);font-size:15px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
  /* высоту дублируем и дополнительно фиксируем из JS: обёртка артефакта
     не всегда даёт dvh ту же высоту, что и видимая область фрейма */
  height:100vh;height:100dvh;overflow:hidden;
  display:flex;flex-direction:column;
}
h1,h2,h3{margin:0;font-family:var(--f-display);font-weight:600;text-wrap:balance;letter-spacing:-.01em}
a{color:inherit}
button{font:inherit;color:inherit}

/* ---------- header ---------- */
.topbar{
  flex:0 0 auto;display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;
  padding:12px 20px 11px;background:var(--surface);border-bottom:1px solid var(--line);
  z-index:20;
}
.topbar h1{font-size:19px;letter-spacing:-.015em}
.topbar h1 .accent{color:var(--accent)}
.tagline{font-size:12.5px;color:var(--muted);letter-spacing:.01em}
.count{
  margin-left:auto;font-family:var(--f-data);font-size:11px;letter-spacing:.06em;
  text-transform:uppercase;color:var(--muted);white-space:nowrap;
}

/* ---------- filters ---------- */
.filters{
  flex:0 0 auto;display:flex;gap:8px 22px;align-items:center;flex-wrap:wrap;
  padding:9px 20px;background:var(--surface);border-bottom:1px solid var(--line);
  overflow-x:auto;scrollbar-width:none;
}
.fgroup{display:flex;gap:7px;align-items:center;flex-wrap:nowrap}
.fgroup+.fgroup{padding-left:22px;border-left:1px solid var(--line-soft)}
.filters::-webkit-scrollbar{display:none}
.flabel{
  font-family:var(--f-data);font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--muted);margin-right:2px;white-space:nowrap;
}
.chip{
  display:inline-flex;align-items:center;gap:7px;white-space:nowrap;
  padding:5px 12px 5px 9px;border:1px solid var(--line);border-radius:999px;
  cursor:pointer;font-size:12.5px;transition:all .16s;
}
.chip .dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
.chip .mark{
  font-family:var(--f-data);font-size:11px;width:11px;text-align:center;flex:0 0 auto;
}
/* ВКЛЮЧЁН: залитый фон, галочка */
.chip[aria-pressed="true"]{
  background:var(--accent-soft);border-color:var(--accent);color:var(--ink);font-weight:600;
}
.chip[aria-pressed="true"] .mark{color:var(--accent)}
.chip[aria-pressed="true"] .mark::before{content:"✓"}
/* ВЫКЛЮЧЕН: пусто, пунктир, приглушённо, крестик */
.chip[aria-pressed="false"]{
  background:transparent;border-style:dashed;border-color:var(--line);
  color:var(--muted);opacity:.65;
}
.chip[aria-pressed="false"] .dot{opacity:.35}
.chip[aria-pressed="false"] .mark::before{content:"✕"}
.chip:hover{border-color:var(--accent);opacity:1}
.chip:focus-visible,.lrow:focus-visible,.btn:focus-visible,.iconbtn:focus-visible,.backbtn:focus-visible{
  outline:2px solid var(--accent);outline-offset:2px;
}
.d-full{background:#2F7D5B}.d-part{background:#B8862B}.d-self{background:#8892A8}

/* ---------- shell ---------- */
.shell{flex:1 1 auto;display:flex;min-height:0;position:relative}

/* ---------- map ---------- */
.mapwrap{
  flex:1 1 auto;position:relative;min-width:0;background:var(--ground);
  touch-action:none;overflow:hidden;
}
svg.map{width:100%;height:100%;display:block;cursor:grab}
svg.map.dragging{cursor:grabbing}
.sea{fill:var(--water);opacity:.55}
.land{fill:var(--land)}
.land-outline{fill:none;stroke:var(--land-line);stroke-width:1.4;vector-effect:non-scaling-stroke;stroke-linejoin:round}
.lake{fill:var(--water);opacity:.8}
.road-case{fill:none;stroke:var(--land);stroke-width:5;vector-effect:non-scaling-stroke;stroke-linecap:round}
.road{fill:none;stroke:var(--road);stroke-width:2;vector-effect:non-scaling-stroke;stroke-linecap:round}
.river{fill:none;stroke:var(--water-line);stroke-width:1.1;vector-effect:non-scaling-stroke;stroke-linecap:round;opacity:.8}
.river.big{stroke-width:2.1;opacity:1}
.roadbadge rect{fill:var(--road)}
.roadbadge text{
  font-family:var(--f-data);font-size:9px;font-weight:600;fill:#20180C;
  text-anchor:middle;dominant-baseline:central;
}
.city circle{fill:var(--land-line)}
.city text{
  font-family:var(--f-data);font-size:8.5px;fill:var(--muted);
  letter-spacing:.05em;text-transform:uppercase;
}
.city.big text{font-size:10px;fill:var(--ink-soft);font-weight:600;letter-spacing:.03em}
.city:not(.big){opacity:0;transition:opacity .25s}
svg.map.zoomed .city:not(.big){opacity:1}
.hilllabel{
  font-family:var(--f-data);fill:var(--muted);opacity:.55;letter-spacing:.22em;
  text-transform:uppercase;pointer-events:none;
}
.riverlabel{
  font-family:var(--f-display);font-style:italic;fill:var(--water-line);opacity:.85;
  letter-spacing:.03em;pointer-events:none;
}

/* маркеры-капли */
.pin{cursor:pointer}
.pin,.pin:focus{outline:none}
.pinshadow{fill:#000;opacity:.16}
.pin .halo{fill:var(--accent);opacity:0;transition:opacity .18s}
.pinbody{stroke:var(--surface);stroke-width:2.2;transition:stroke .15s,stroke-width .15s}
.pinhole{fill:var(--surface)}
.pin .num{
  font-family:var(--f-data);font-size:10px;font-weight:700;
  text-anchor:middle;dominant-baseline:central;pointer-events:none;
}
.pin .pinlabel{
  font-family:var(--f-body);font-size:10.5px;font-weight:600;fill:var(--ink);
  paint-order:stroke;stroke:var(--land);stroke-width:3.2px;stroke-linejoin:round;
  pointer-events:none;opacity:.92;
}
.pin:hover .halo,.pin.active .halo,.pin:focus-visible .halo{opacity:.22}
.pin.active .halo{opacity:.3}
.pin.active .pinbody,.pin:focus-visible .pinbody{stroke:var(--accent);stroke-width:3.4}
.pin.active .pinlabel{opacity:1}
.pin.dim{opacity:.14;pointer-events:none}

/* карточка-подсказка у маркера */
.maptip{
  position:absolute;z-index:8;pointer-events:none;transform:translate(-50%,-100%);
  background:var(--surface);border:1px solid var(--line);border-radius:12px;
  padding:10px 13px;box-shadow:var(--shadow-lift);
  display:none;flex-direction:column;gap:3px;min-width:180px;max-width:260px;
}
.maptip.on{display:flex}
.maptip .t-name{font-family:var(--f-display);font-size:14.5px;font-weight:600;line-height:1.2}
.maptip .t-meta{font-size:11.5px;color:var(--ink-soft);display:flex;align-items:center;gap:6px}
.maptip .t-place{font-size:11px;color:var(--muted)}
.maptip .t-cta{
  font-family:var(--f-data);font-size:9.5px;letter-spacing:.07em;text-transform:uppercase;
  color:var(--accent);margin-top:4px;
}
.maptip .sq{width:7px;height:7px;border-radius:2px;flex:0 0 auto}
@media (hover:none){.maptip{display:none !important}}

.mapctl{position:absolute;right:14px;bottom:14px;display:flex;flex-direction:column;gap:6px;z-index:5}
.iconbtn{
  width:34px;height:34px;display:grid;place-items:center;cursor:pointer;
  background:var(--surface);border:1px solid var(--line);border-radius:9px;
  box-shadow:var(--shadow);font-size:15px;line-height:1;
}
.iconbtn:hover{background:var(--surface-2)}
.iconbtn.wide{width:auto;padding:0 11px;font-size:11.5px;font-family:var(--f-data);letter-spacing:.04em}
.maphint{
  position:absolute;left:14px;bottom:14px;font-family:var(--f-data);font-size:10px;
  letter-spacing:.05em;color:var(--muted);text-transform:uppercase;pointer-events:none;
}

/* ---------- panel ---------- */
.panel{
  flex:0 0 400px;display:flex;flex-direction:column;min-height:0;
  background:var(--surface);border-left:1px solid var(--line);z-index:15;
}
.grabber{display:none}
.panelhead{
  flex:0 0 auto;padding:14px 18px 11px;border-bottom:1px solid var(--line-soft);
  display:flex;align-items:center;gap:10px;
}
.panelhead h2{font-size:15px}
.panelhead .sub{font-size:12px;color:var(--muted);margin-top:2px}
.backbtn{
  display:none;align-items:center;gap:6px;background:transparent;border:1px solid var(--line);
  border-radius:999px;padding:5px 12px 5px 9px;cursor:pointer;font-size:12.5px;white-space:nowrap;
}
.backbtn:hover{background:var(--surface-2)}
body.detail .backbtn{display:inline-flex}
.panelbody{flex:1 1 auto;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}

/* list */
.list{display:flex;flex-direction:column}
.lrow{
  display:grid;grid-template-columns:26px 1fr auto;gap:10px 12px;align-items:start;
  width:100%;text-align:left;background:transparent;border:0;border-bottom:1px solid var(--line-soft);
  padding:12px 18px;cursor:pointer;transition:background .14s;
}
.lrow:hover,.lrow.hl{background:var(--surface-2)}
.lrow.hl{box-shadow:inset 3px 0 0 var(--accent)}
.lrow .idx{
  font-family:var(--f-data);font-size:10.5px;color:var(--muted);padding-top:3px;
  font-variant-numeric:tabular-nums;
}
.lrow .nm{font-family:var(--f-display);font-size:15px;font-weight:600;line-height:1.25}
.lrow .mt{font-size:11.5px;color:var(--muted);margin-top:3px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.lrow .sq{width:7px;height:7px;border-radius:2px;flex:0 0 auto}
.lrow .stay{color:var(--muted)}
.lrow .rowprice{
  font-family:var(--f-data);font-size:11px;color:var(--ink-soft);text-align:right;
  white-space:nowrap;padding-top:3px;font-variant-numeric:tabular-nums;max-width:96px;
}
.lrow.hidden{display:none}

/* detail */
.detail{padding:0 0 40px}
.dhero{padding:18px 18px 16px;border-bottom:1px solid var(--line-soft)}
.eyebrow{
  font-family:var(--f-data);font-size:10px;letter-spacing:.11em;text-transform:uppercase;
  color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap;
}
.dhero h2{font-size:23px;line-height:1.15;margin:7px 0 8px}
.badge{
  display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;
  font-size:11.5px;font-family:var(--f-body);letter-spacing:0;text-transform:none;
  border:1px solid var(--line);
}
.badge .sq{width:7px;height:7px;border-radius:2px}
.lede{font-size:14px;color:var(--ink-soft);line-height:1.55;margin:0}
.pricetag{
  margin-top:13px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;
  background:var(--surface-2);display:flex;flex-direction:column;gap:4px;
}
.pricetag .pv{
  font-family:var(--f-data);font-size:14px;font-weight:600;color:var(--ink);
  font-variant-numeric:tabular-nums;letter-spacing:-.01em;
}
.pricetag .pn{font-size:12px;line-height:1.5;color:var(--muted)}

.sec{padding:15px 18px;border-bottom:1px solid var(--line-soft)}
.sec h3{
  font-family:var(--f-data);font-size:10px;letter-spacing:.11em;text-transform:uppercase;
  color:var(--muted);font-weight:500;margin-bottom:8px;
}
.sec p{margin:0;font-size:13.5px;line-height:1.55;color:var(--ink-soft)}
.facts{display:grid;grid-template-columns:auto 1fr;gap:7px 14px;font-size:13px}
.facts dt{color:var(--muted);white-space:nowrap}
.facts dd{margin:0;color:var(--ink-soft)}
.price{font-family:var(--f-data);font-size:12.5px;font-variant-numeric:tabular-nums}

.links{display:flex;flex-direction:column;gap:7px}
.btn{
  display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;
  border:1px solid var(--line);background:var(--surface-2);text-decoration:none;
  font-size:13.5px;transition:border-color .15s,background .15s,transform .12s;
}
.btn:hover{border-color:var(--accent);transform:translateY(-1px)}
.btn .ico{
  width:26px;height:26px;flex:0 0 auto;display:grid;place-items:center;border-radius:7px;
  background:var(--ground);font-size:13px;
}
.btn .txt{display:flex;flex-direction:column;line-height:1.3;min-width:0}
.btn .txt b{font-weight:600}
.btn .txt span{font-size:11.5px;color:var(--muted);word-break:break-word}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary .ico{background:rgba(255,255,255,.16)}
.btn.primary .txt span{color:rgba(255,255,255,.75)}
:root[data-theme="dark"] .btn.primary .txt span{color:rgba(26,16,23,.7)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.primary .txt span{color:rgba(26,16,23,.7)}}
.btn .tel{font-family:var(--f-data);font-variant-numeric:tabular-nums}
.note{
  margin:14px 18px 0;padding:11px 13px;border-left:2px solid var(--gold);
  background:var(--gold-soft);font-size:12.5px;line-height:1.5;color:var(--ink-soft);border-radius:0 7px 7px 0;
}
.foot{
  padding:14px 18px 0;font-size:11.5px;line-height:1.55;color:var(--muted);
}
.foot a{color:var(--muted)}

/* ---------- mobile: bottom sheet ---------- */
@media (max-width:880px){
  body{overflow:hidden}
  .topbar{padding:10px 14px 9px}
  .topbar h1{font-size:17px}
  .tagline{display:none}
  .filters{padding:8px 14px;flex-wrap:nowrap;gap:8px 14px}
  .fgroup+.fgroup{padding-left:14px}
  .shell{display:block;position:relative}
  .mapwrap{position:absolute;inset:0}
  .panel{
    position:absolute;left:0;right:0;bottom:0;top:auto;flex:none;
    height:78%;border-left:0;border-top:1px solid var(--line);
    border-radius:16px 16px 0 0;box-shadow:var(--shadow-lift);
    transform:translateY(calc(100% - 58px));
    transition:transform .34s cubic-bezier(.32,.72,0,1);
  }
  body.sheet-open .panel{transform:translateY(0)}
  .grabber{
    display:flex;flex-direction:column;align-items:center;gap:7px;
    padding:9px 0 0;cursor:pointer;flex:0 0 auto;background:transparent;border:0;width:100%;
  }
  .grabber .bar{width:38px;height:4px;border-radius:2px;background:var(--line)}
  .grabber .peek{
    font-family:var(--f-data);font-size:11px;letter-spacing:.06em;text-transform:uppercase;
    color:var(--muted);padding-bottom:2px;
  }
  body.sheet-open .grabber .peek{opacity:0;height:0;padding:0;overflow:hidden}
  .panelhead{padding:10px 16px 10px}
  .lrow,.sec,.dhero{padding-left:16px;padding-right:16px}
  .maphint{display:none}
  .mapctl{bottom:auto;top:12px;right:12px}
  .count{font-size:10px}
}
@media (max-width:420px){
  .topbar h1{font-size:15.5px}
  .dhero h2{font-size:20px}
}
@media (prefers-reduced-motion:reduce){
  *{transition-duration:.01ms !important;animation-duration:.01ms !important}
}
</style>

<header class="topbar">
  <h1>Kolacja i nocleg <span class="accent">w winnicy</span></h1>

  <span class="count" id="count">12 мест</span>
</header>

<nav class="filters" aria-label="Фильтры">
  <div class="fgroup">
    <span class="flabel">Ужин</span>

  <div class="fgroup">
    <span class="flabel">Ночлег</span>
    <button class="chip" data-g="stay" data-f="hotel" aria-pressed="true"><span class="mark"></span>Отель на месте</button>
    <button class="chip" data-g="stay" data-f="rooms" aria-pressed="true"><span class="mark"></span>Комнаты у винодела</button>
    <button class="chip" data-g="stay" data-f="house" aria-pressed="true"><span class="mark"></span>Домик / апартамент</button>

<div class="shell">

  <aside class="panel" id="panel">
    <button class="grabber" id="grabber" aria-label="Открыть или закрыть список">
      <span class="bar"></span>
      <span class="peek" id="peek">Список мест ↑</span>
    </button>
    <div class="panelhead">
      <button class="backbtn" id="back">← К карте</button>

        <h2 id="ptitle">Все виноградники</h2>
        <div class="sub" id="psub">Нажмите точку на карте или строку в списке</div>
      </div>
    </div>
    <div class="panelbody" id="pbody"></div>
  </aside>
</div>

var K=1000, COSLAT=Math.cos(52*Math.PI/180);
function px(lon){return lon*COSLAT*K}
function py(lat){return -lat*K}
function toPath(pts,close){
  var d="";
  for(var i=0;i<pts.length;i++) d+=(i?"L":"M")+px(pts[i][1]).toFixed(1)+" "+py(pts[i][0]).toFixed(1)+" ";
  return d+(close?"Z":"");
}
/* сглаженная кривая через точки — реки и дороги не должны выглядеть ломаными */
function smoothPath(pts){
  if(pts.length<3) return toPath(pts,false);
  var P=pts.map(function(q){return [px(q[1]),py(q[0])]});
  var d="M"+P[0][0].toFixed(1)+" "+P[0][1].toFixed(1);
  for(var i=0;i<P.length-1;i++){
    var p0=P[i>0?i-1:0], p1=P[i], p2=P[i+1], p3=P[i+2<P.length?i+2:i+1];
    var c1x=p1[0]+(p2[0]-p0[0])/6, c1y=p1[1]+(p2[1]-p0[1])/6;
    var c2x=p2[0]-(p3[0]-p1[0])/6, c2y=p2[1]-(p3[1]-p1[1])/6;
    d+="C"+c1x.toFixed(1)+" "+c1y.toFixed(1)+","+c2x.toFixed(1)+" "+c2y.toFixed(1)+","+p2[0].toFixed(1)+" "+p2[1].toFixed(1);
  }
  return d;
}

var tipEl=document.createElement("div");

var tipFor=null;
function showTip(rec){
  if(window.matchMedia("(hover:none)").matches) return;
  var p=rec.p, d=DINE[p.dine];
  tipEl.innerHTML='<span class="t-name">'+esc(p.name)+'</span>'+
    '<span class="t-meta"><span class="sq '+d.cls+'"></span>'+esc(d.label)+'</span>'+
    '<span class="t-place">'+esc(p.place)+' · '+esc(p.region)+'</span>'+
    '<span class="t-cta">Нажмите — контакты и бронирование</span>';
  tipFor=rec; positionTip(); tipEl.classList.add("on");
}
function positionTip(){
  if(!tipFor) return;
  var r=svg.getBoundingClientRect(), m=mapwrap.getBoundingClientRect();
  var sx=(tipFor.x-vb.x)/vb.w*r.width+(r.left-m.left);
  var sy=(tipFor.y-vb.y)/vb.h*r.height+(r.top-m.top);
  tipEl.style.left=sx+"px";
  tipEl.style.top=(sy-46)+"px";
}
function hideTip(){tipEl.classList.remove("on");tipFor=null}

function pinNodeFrom(node){
  while(node&&node!==svg){
    if(node.classList&&node.classList.contains("pin")) return node;
    node=node.parentNode;
  }
  return null;
}
function pinRecFrom(node){
  var g=pinNodeFrom(node); if(!g) return null;
  var n=+g.getAttribute("data-n");
  return pins.filter(function(r){return r.p.n===n})[0]||null;
}
svg.addEventListener("click",function(e){
  if(dragMoved) return;                       /* клик в конце перетаскивания не считается */
  var rec=pinRecFrom(e.target);
  if(rec) select(rec.p.n);
});
svg.addEventListener("mousemove",function(e){
  if(Object.keys(ptrs).length) return;        /* во время перетаскивания подсказку не трогаем */
  var rec=pinRecFrom(e.target);
  if(rec){
    if(tipFor!==rec){
      if(tipFor) highlightRow(tipFor.p.n,false);
      showTip(rec); highlightRow(rec.p.n,true);
    }
  }else if(tipFor){
    highlightRow(tipFor.p.n,false); hideTip();
  }
});
svg.addEventListener("mouseleave",function(){
  if(tipFor){highlightRow(tipFor.p.n,false);hideTip()}
});

  var u=rect.width?vb.w/rect.width:1;
  var scale=Math.min(u,BASE.w/900);           /* не даём меткам раздуться на узком экране */
  pins.forEach(function(r){
    r.inner.setAttribute("transform","scale("+u+")");
    r.g.setAttribute("transform","translate("+r.x+","+r.y+")");
  });
  cityNodes.forEach(function(c){
    c.g.setAttribute("transform","translate("+c.x+","+c.y+") scale("+u+")");
  });
  roadNodes.forEach(function(c){
    c.g.setAttribute("transform","translate("+c.x+","+c.y+") scale("+u+")");
  });
  hillNodes.concat(riverNodes).forEach(function(c){
    c.txt.setAttribute("font-size",(11*u)+"px");
    c.txt.setAttribute("x",c.x); c.txt.setAttribute("y",c.y);
  });
  /* при сильном приближении показываем второстепенные города */
  var z=BASE.w/vb.w;
  svg.classList.toggle("zoomed",z>1.7);
  positionTip();
}
function clampVB(){
  var minW=BASE.w*0.08, maxW=HOME.w*1.35;
  vb.w=Math.max(minW,Math.min(maxW,vb.w));
  vb.h=vb.w*(HOME.h/HOME.w);
  var mx=HOME.w*0.3, my=HOME.h*0.3;
  vb.x=Math.max(HOME.x-mx,Math.min(HOME.x+HOME.w+mx-vb.w,vb.x));
  vb.y=Math.max(HOME.y-my,Math.min(HOME.y+HOME.h+my-vb.h,vb.y));
}
function fitAspect(){
  var r=mapwrap.getBoundingClientRect();
  HOME.x=BASE.x; HOME.y=BASE.y; HOME.w=BASE.w; HOME.h=BASE.h;
  if(!r.width||!r.height) return;
  var boxAR=r.width/r.height, mapAR=BASE.w/BASE.h;
  if(boxAR>mapAR){var nw=BASE.h*boxAR; HOME.x=BASE.x-(nw-BASE.w)/2; HOME.w=nw;}
  else{var nh=BASE.w/boxAR; HOME.y=BASE.y-(nh-BASE.h)/2; HOME.h=nh;}
  svg.setAttribute("preserveAspectRatio","xMidYMid meet");
}
function zoomAt(factor,cx,cy){
  var nw=vb.w*factor, nh=vb.h*factor;
  var minW=BASE.w*0.08, maxW=HOME.w*1.35;
  if(nw<minW){nw=minW;nh=nw*(vb.h/vb.w)} if(nw>maxW){nw=maxW;nh=nw*(vb.h/vb.w)}
  vb.x=cx-(cx-vb.x)*(nw/vb.w);
  vb.y=cy-(cy-vb.y)*(nh/vb.h);
  vb.w=nw; vb.h=nh; clampVB(); applyVB();
}
function svgPoint(clientX,clientY){
  var r=svg.getBoundingClientRect();
  return {x:vb.x+(clientX-r.left)/r.width*vb.w, y:vb.y+(clientY-r.top)/r.height*vb.h};
}
svg.addEventListener("wheel",function(e){
  e.preventDefault(); hideTip();
  var pt=svgPoint(e.clientX,e.clientY);
  zoomAt(e.deltaY>0?1.14:0.88,pt.x,pt.y);
},{passive:false});

var ptrs={}, lastDist=0, dragStart=null, dragMoved=false, captured=false;
svg.addEventListener("pointerdown",function(e){
  ptrs[e.pointerId]={x:e.clientX,y:e.clientY};
  dragStart={x:e.clientX,y:e.clientY};
  dragMoved=false;
  svg.classList.add("dragging");
});
svg.addEventListener("pointermove",function(e){
  if(!ptrs[e.pointerId]) return;
  var ids=Object.keys(ptrs), r=svg.getBoundingClientRect();
  if(ids.length===1){
    var prev=ptrs[e.pointerId];
    var dx=(e.clientX-prev.x)/r.width*vb.w, dy=(e.clientY-prev.y)/r.height*vb.h;
    vb.x-=dx; vb.y-=dy; clampVB(); applyVB();
    ptrs[e.pointerId]={x:e.clientX,y:e.clientY};
    if(dragStart&&(Math.abs(e.clientX-dragStart.x)>4||Math.abs(e.clientY-dragStart.y)>4)){
      dragMoved=true; hideTip();
      if(!captured){svg.setPointerCapture(e.pointerId);captured=true}
    }
  }else if(ids.length===2){
    ptrs[e.pointerId]={x:e.clientX,y:e.clientY};
    var a=ptrs[ids[0]],b=ptrs[ids[1]];
    var d=Math.hypot(a.x-b.x,a.y-b.y);
    if(lastDist){var mid=svgPoint((a.x+b.x)/2,(a.y+b.y)/2); zoomAt(lastDist/d,mid.x,mid.y);}
    lastDist=d; dragMoved=true;
    if(!captured){try{svg.setPointerCapture(e.pointerId);captured=true}catch(err){}}
  }
});
function endPtr(e){
  delete ptrs[e.pointerId];
  if(Object.keys(ptrs).length<2) lastDist=0;
  if(!Object.keys(ptrs).length){
    svg.classList.remove("dragging");
    if(captured){try{svg.releasePointerCapture(e.pointerId)}catch(err){}captured=false}
    setTimeout(function(){dragMoved=false},0);
  }
}
svg.addEventListener("pointerup",endPtr);
svg.addEventListener("pointercancel",endPtr);
svg.addEventListener("pointerleave",function(e){endPtr(e);hideTip()});

document.getElementById("zin").onclick=function(){hideTip();zoomAt(0.7,vb.x+vb.w/2,vb.y+vb.h/2)};
document.getElementById("zout").onclick=function(){hideTip();zoomAt(1.42,vb.x+vb.w/2,vb.y+vb.h/2)};
document.getElementById("zreset").onclick=function(){hideTip();goHome()};
function goHome(){vb={x:HOME.x,y:HOME.y,w:HOME.w,h:HOME.h};applyVB()}
function flyTo(x,y,w){
  var nw=Math.max(BASE.w*0.16,w);
  vb.w=nw; vb.h=nw*(HOME.h/HOME.w);
  vb.x=x-vb.w/2; vb.y=y-vb.h/2; clampVB(); applyVB();
}

/* ============ ПАНЕЛЬ ============ */
var pbody=document.getElementById("pbody"),
    ptitle=document.getElementById("ptitle"),
    psub=document.getElementById("psub"),
    back=document.getElementById("back"),
    peek=document.getElementById("peek"),
    countEl=document.getElementById("count"),
    grabber=document.getElementById("grabber");

var active=null, filters={dine:{full:true,part:true,self:true},stay:{hotel:true,rooms:true,house:true}};
var isMobile=function(){return window.matchMedia("(max-width:880px)").matches};
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function mapsUrl(p){return "https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(p.name+", "+p.addr)}

var STAY={hotel:"Отель на месте",rooms:"Комнаты у винодела",house:"Домик / апартамент"};
function passes(p){return filters.dine[p.dine]&&filters.stay[p.stay]}
function visible(){return PLACES.filter(passes)}

function renderList(){
  var vis=visible();
  var h='<div class="list">';
  PLACES.forEach(function(p){
    var d=DINE[p.dine], hide=passes(p)?"":" hidden";
    h+='<button class="lrow'+hide+'" data-n="'+p.n+'">'+
       '<span class="idx">'+(p.n<10?"0":"")+p.n+'</span>'+
       '<span><span class="nm">'+esc(p.name)+'</span>'+
       '<span class="mt"><span class="sq '+d.cls+'"></span>'+esc(d.label)+' · '+esc(p.region)+'</span>'+
       '<span class="mt"><span class="stay">'+esc(STAY[p.stay])+'</span></span></span>'+
       '<span class="rowprice">'+esc(p.price)+'</span></button>';
  });
  h+='</div><div class="foot">Данные собраны 8 сентября 2026 из сайтов объектов и площадок бронирования. Цены на Booking проверены на даты 9–11 октября 2026 (2 гостя) и меняются в зависимости от сезона и дат — подтверждайте перед поездкой. Точки на карте поставлены по адресам с точностью до населённого пункта; для навигации пользуйтесь ссылкой «Открыть в Google Maps» в карточке.</div>';
  pbody.innerHTML=h;
  pbody.querySelectorAll(".lrow").forEach(function(b){
    b.addEventListener("click",function(){select(+b.dataset.n)});
    b.addEventListener("mouseenter",function(){hover(+b.dataset.n,true)});
    b.addEventListener("mouseleave",function(){hover(+b.dataset.n,false)});
  });
  ptitle.textContent="Все виноградники";
  psub.textContent=vis.length===PLACES.length?"Нажмите точку на карте или строку в списке":"Показано "+vis.length+" из "+PLACES.length;
  countEl.textContent=vis.length+" из "+PLACES.length+" мест";
  peek.textContent="Список · "+vis.length+" мест ↑";
}

function renderDetail(p){
  var d=DINE[p.dine];
  var h='<div class="detail"><div class="dhero">'+
    '<div class="eyebrow"><span>'+(p.n<10?"0":"")+p.n+'</span><span>'+esc(p.region)+'</span>'+
    '<span class="badge"><span class="sq '+d.cls+'"></span>'+esc(d.label)+'</span>'+
    '<span class="badge">'+esc(STAY[p.stay])+'</span></div>'+
    '<h2>'+esc(p.name)+'</h2><p class="lede">'+esc(p.lede)+'</p>'+
    '<div class="pricetag"><span class="pv">'+esc(p.price)+'</span><span class="pn">'+esc(p.pnote)+'</span></div></div>';

  h+='<div class="sec"><h3>Ужин</h3><p>'+esc(p.dinner)+'</p></div>';
  h+='<div class="sec"><h3>Ночлег</h3><p>'+esc(p.sleep)+'</p></div>';

  h+='<div class="sec"><h3>Коротко</h3><dl class="facts">';
  h+='<dt>Адрес</dt><dd>'+esc(p.addr)+'</dd>';
  p.extra.forEach(function(e){h+='<dt>'+esc(e[0])+'</dt><dd class="'+(/\d/.test(e[1])&&e[1].indexOf("zł")>-1?"price":"")+'">'+esc(e[1])+'</dd>'});
  h+='</dl></div>';

  h+='<div class="sec"><h3>Забронировать</h3><div class="links">';
  p.book.forEach(function(b,i){
    h+='<a class="btn'+(i===0?" primary":"")+'" href="'+esc(b[1])+'" target="_blank" rel="noopener">'+
       '<span class="ico">'+(i===0?"◆":"↗")+'</span><span class="txt"><b>'+esc(b[0])+'</b><span>'+esc(b[2])+'</span></span></a>';
  });
  h+='</div></div>';

  h+='<div class="sec"><h3>Связаться</h3><div class="links">';
  if(p.tel.length){
    p.tel.forEach(function(t){
      h+='<a class="btn" href="tel:'+t[0].replace(/\s/g,"")+'"><span class="ico">☎</span>'+
         '<span class="txt"><b class="tel">'+esc(t[0])+'</b><span>'+esc(t[1])+'</span></span></a>';
    });
  }
  if(p.mail){
    h+='<a class="btn" href="mailto:'+esc(p.mail)+'"><span class="ico">✉</span>'+
       '<span class="txt"><b>E-mail</b><span>'+esc(p.mail)+'</span></span></a>';
  }
  h+='<a class="btn" href="'+esc(p.web[1])+'" target="_blank" rel="noopener"><span class="ico">▤</span>'+
     '<span class="txt"><b>Сайт</b><span>'+esc(p.web[0])+'</span></span></a>';
  h+='<a class="btn" href="'+esc(mapsUrl(p))+'" target="_blank" rel="noopener"><span class="ico">◎</span>'+
     '<span class="txt"><b>Открыть в Google Maps</b><span>'+esc(p.place)+'</span></span></a>';
  h+='</div></div>';

  if(!p.tel.length){
    h+='<div class="note">Телефон объект публично не указывает — пишите на e-mail или бронируйте через площадку выше.</div>';
  }
  h+='</div>';
  pbody.innerHTML=h;
  pbody.scrollTop=0;
  ptitle.textContent=p.name.replace(/^Winnica /,"");
  psub.textContent=p.place;
}

function hover(n,on){
  if(n===active) return;                 /* выбранную точку подсветка не гасит */
  pins.forEach(function(r){ if(r.p.n===n) r.g.classList.toggle("active",on); });
}
/* наведение на маркер подсвечивает строку в списке и наоборот */
function highlightRow(n,on){
  var row=pbody.querySelector('.lrow[data-n="'+n+'"]');
  if(!row) return;
  row.classList.toggle("hl",on);
  if(on&&!document.body.classList.contains("detail")){
    var pr=pbody.getBoundingClientRect(), rr=row.getBoundingClientRect();
    if(rr.top<pr.top||rr.bottom>pr.bottom) row.scrollIntoView({block:"nearest",behavior:"smooth"});
  }
}

function select(n){
  var p=PLACES.filter(function(x){return x.n===n})[0];
  if(!p) return;
  active=n;
  document.body.classList.add("detail");
  pins.forEach(function(r){r.g.classList.toggle("active",r.p.n===n)});
  var top=pins.filter(function(x){return x.p.n===n})[0];
  gPins.appendChild(top.g);              /* активный маркер рисуем поверх соседей */
  renderDetail(p);
  back.textContent=isMobile()?"← К карте":"← Все места";
  var r=pins.filter(function(x){return x.p.n===n})[0];
  if(vb.w>HOME.w*0.9) flyTo(r.x,r.y,HOME.w*0.45); 
  openSheet(true);
}

function unselect(){
  active=null;
  document.body.classList.remove("detail");
  pins.forEach(function(r){r.g.classList.remove("active")});
  renderList();
  if(isMobile()) openSheet(false);
}
back.addEventListener("click",unselect);

/* фильтры */
document.querySelectorAll(".chip").forEach(function(c){
  c.addEventListener("click",function(){
    var g=c.dataset.g, f=c.dataset.f, on=c.getAttribute("aria-pressed")==="true";
    var others=Object.keys(filters[g]).filter(function(k){return k!==f&&filters[g][k]});
    if(on&&!others.length) return;          /* последний включённый чип в группе не гасим */
    filters[g][f]=!on; c.setAttribute("aria-pressed",String(!on));
    pins.forEach(function(r){r.g.classList.toggle("dim",!passes(r.p))});
    var cur=active&&PLACES.filter(function(x){return x.n===active})[0];
    if(cur&&!passes(cur)) unselect();
    else if(!active) renderList();
    else{
      var vis=visible();
      countEl.textContent=vis.length+" из "+PLACES.length+" мест";
      peek.textContent="Список · "+vis.length+" мест ↑";
    }
  });
});

/* мобильный лист */
function openSheet(open){
  if(!isMobile()){document.body.classList.remove("sheet-open");return}
  document.body.classList.toggle("sheet-open",open);
}
grabber.addEventListener("click",function(){
  document.body.classList.toggle("sheet-open");
});
/* свайп по «ручке» */
var sy=null;
grabber.addEventListener("pointerdown",function(e){sy=e.clientY});
grabber.addEventListener("pointerup",function(e){
  if(sy===null) return;
  var dy=e.clientY-sy; sy=null;
  if(dy>24) document.body.classList.remove("sheet-open");
  else if(dy<-24) document.body.classList.add("sheet-open");
});

document.addEventListener("keydown",function(e){
  if(e.key==="Escape"){ if(document.body.classList.contains("detail")) unselect(); else openSheet(false); }
});
window.addEventListener("resize",function(){
  fitAspect(); clampVB(); applyVB();
  if(active) back.textContent=isMobile()?"← К карте":"← Все места";
  if(!isMobile()) document.body.classList.remove("sheet-open");
});

var userZoomed=false;
svg.addEventListener("wheel",function(){userZoomed=true},{passive:true});
["zin","zout"].forEach(function(id){document.getElementById(id).addEventListener("click",function(){userZoomed=true})});
document.getElementById("zreset").addEventListener("click",function(){userZoomed=false});

function relayout(){
  fitAspect();
  if(userZoomed){clampVB(); applyVB();} else {goHome();}
}
if(window.ResizeObserver){
  var ro=new ResizeObserver(function(){relayout()});
  ro.observe(document.getElementById("mapwrap"));
}
window.addEventListener("load",relayout);

/* старт */
relayout(); renderList();
requestAnimationFrame(relayout);
})();
</script>
